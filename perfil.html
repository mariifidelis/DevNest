<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Perfil | DevNest</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="perfil-page">
  <div class="perfil-shell">
    <header class="perfil-header">
      <a href="index.html" class="perfil-logo">DevNest</a>
      <button class="menu-toggle perfil-toggle" type="button" aria-label="Abrir menu" aria-expanded="false">☰</button>
      <nav class="perfil-nav main-nav">
        <a href="index.html">Home</a>
        <a href="projetos.html">Projetos</a>
        <a href="minhas-propostas.html">Propostas</a>
      </nav>
    </header>

    <main class="perfil-main">
      <p class="perfil-hello">Olá, meu nome é <span id="profileName">Augusto</span></p>
      <h1 id="Bio">Eu sou um designer gráfico com habilidades<br>em logo, visual e interação de design.</h1>

      <div id="Photo" class="perfil-photo" style="--photo:url('img/perfil.jpg')" aria-label="Foto do perfil"></div>
      <h2 id="Location">Austrália, Sydney</h2>

      <div class="perfil-columns">
        <section>
          <h3>Projetos</h3>
          <p>Projetos selecionados e trabalhos realizados.</p>
        </section>
        <section>
          <h3>Habilidades</h3>
          <p id="Skills">UI/UX · Identidade visual · Web</p>
        </section>
      </div>

      <div class="perfil-links">
        <a id="Portfolio" href="#">Portifólio</a>
        <a id="Linkedin" href="#">LinkedIn</a>
        <a id="Github" href="#">Git Hub</a>
      </div>
    </main>
    <footer class="footer perfil-footer">DevNest</footer>
  </div>
  <script src="js/script.js"></script>
</body>
</html>
