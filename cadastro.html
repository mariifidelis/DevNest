<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Devenest</title>
    <link rel="icon" type="image/x-icon" href="src/img/logo.jpeg">
    <link rel="stylesheet" href="css/style.css">
</head>

<body class="topbar">
    <div class="topbar">

        <header class="header">
            <div class="logo">
                <img src="../img/logo.jpeg" alt="Logo Devenest">
            </div>
            <nav class="nav">
                <ul>
                    <li><a href="index.html">Home</a></li>
                    <button class="menu-toggle" type="button" aria-label="Abrir menu" aria-expanded="false">☰</button>
                    <nav class="main-nav" aria-label="Navegação principal">
                </ul>
            </nav>
        </header>

        <div class="name">
      <h1 class="nametag">DevNest</h1>

      <div class="cadastrocard">
        <h2>Cadastro</h2>

        <div id="form-feedback" role="status"
          style="display:none; margin-bottom:20px; padding:12px 16px; border-radius:12px; background:#eaf7ee; color:#1c7a3d; font-size:0.85rem; text-align:center;">
        </div>

        <form id="regiform" novalidate>
          <div class="field">
            <label for="nome">Nome completo</label>
            <input type="text" id="nome" name="nome" placeholder="Como você quer ser chamado" required>
          </div>

          <div class="field">
            <label for="profissao">Profissão</label>
            <input type="text" id="profissao" name="profissao" placeholder="Ex: Desenvolvedor(a) Front-end" required>
          </div>

          <div class="field">
            <label for="area">Área de atuação</label>
            <input type="text" id="area" name="area" placeholder="Ex: Web, Dados, Cyber, UI/UX">
          </div>

          <div class="field">
            <label for="pjcpf">PJ / CPF</label>
            <input type="text" id="pjcpf" name="pjcpf" placeholder="00.000.000/0000-00 ou 000.000.000-00" required>
          </div>

          <div class="field">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" placeholder="voce@email.com" autocomplete="email" required>
          </div>

          <div class="field">
            <label for="telefone">Telefone</label>
            <input type="tel" id="telefone" name="telefone" placeholder="(00) 00000-0000" autocomplete="tel">
          </div>

          <div class="field field-row3">
            <div>
              <label for="pais">País</label>
              <input type="text" id="pais" name="pais" placeholder="País">
            </div>
            <div>
              <label for="cidade">Cidade</label>
              <input type="text" id="cidade" name="cidade" placeholder="Cidade">
            </div>
            <div>
              <label for="estado">Estado</label>
              <input type="text" id="estado" name="estado" placeholder="Estado">
            </div>
          </div>

          <div class="field">
            <label for="senha">Senha</label>
            <input type="password" id="senha" name="senha" placeholder="Mínimo de 8 caracteres"
              autocomplete="new-password" required minlength="8">
          </div>

          <div class="field">
            <label for="confirma-senha">Confirme a senha</label>
            <input type="password" id="confirma-senha" name="confirma_senha" placeholder="Repita a senha"
              autocomplete="new-password" required>
            <span class="field-error" id="erro-senha"></span>
          </div>

          <hr class="formdiv">

          <div class="photoupload">
            <span class="photo">Foto</span>
            <div class="photocircle" id="photocircle" role="button" tabindex="0"
              aria-label="Selecionar foto de perfil">

              <span id="avatar-placeholder-svg">
                <svg width="40" height="40" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                  <circle cx="12" cy="8" r="3.4" stroke="currentColor" stroke-width="1.6" />
                  <path d="M4.5 19.2c1.6-3.2 4.4-4.8 7.5-4.8s5.9 1.6 7.5 4.8" stroke="currentColor" stroke-width="1.6"
                    stroke-linecap="round" />
                </svg>
  
              </span>
            </div>
            <button type="file" class="photobtn" accept="image/*">Escolher Imagem</button>
            
          </div>

          <div class="field">
            <label for="skills">Habilidades</label>
            <div class="inputbox" id="skillsbox">
              <input type="text" id="skillsinput" placeholder="Digite e pressione Enter (ex: Figma, React)">
            </div>
            <span class="hint">Pressione Enter ou vírgula para adicionar cada habilidade.</span>
            <input type="hidden" id="skillshidden" name="habilidades">
          </div>

          <div class="field">
            <label for="projetos-exp">Projetos / experiências</label>
            <textarea id="projetos-exp" name="projetos_experiencias"
              placeholder="Conte brevemente sobre projetos ou experiências relevantes"></textarea>
          </div>

          <div class="field">
            <label for="portfolio">Portfólio</label>
            <input type="url" id="portfolio" name="portfolio" placeholder="https://seuportfolio.com">
          </div>

          <div class="field">
            <label for="linkedin">LinkedIn</label>
            <input type="url" id="linkedin" name="linkedin" placeholder="https://linkedin.com/in/voce">
          </div>

          <div class="field">
            <label for="github">GitHub</label>
            <input type="url" id="github" name="github" placeholder="https://github.com/voce">
          </div>

          <div class="checkbox-row">
            <input type="checkbox" id="termos" name="termos" required>
            <label for="termos">Li e concordo com os <a href="#">Termos de Política e Privacidade</a>.</label>
          </div>

          <button type="submit" class="btncad"><a href="perfil.html">Cadastrar-se</a></button>
        </form>
      </div>
    </div>
  </main>
